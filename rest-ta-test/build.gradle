dependencies {

  implementation project(":rest-ta")

  // openflexo dep
  implementation group: 'junit', name: 'junit', version: '4.13.2'

  // testing dep
  testImplementation flexoFoundation()
  testImplementation flexoFoundationTest()
  testImplementation fmlCli()
  testImplementation fmlCliTest()

  // rest-ta declares these as `implementation` (java-library), so they aren't exposed transitively to this
  // module's test compile classpath even though `rest-ta` itself is a dependency - tests using rest-assured/jackson
  // directly (rather than only through rest-ta's own API) need them declared explicitly here too.
  testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.3.0'
  testImplementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.8.1'

  // Test resource center
  testRuntimeOnly project(':rest-ta-test-rc')
  
}
